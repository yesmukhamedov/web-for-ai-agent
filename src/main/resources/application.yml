spring:
  application:
    name: ai-first-knowledge
  datasource:
    url: jdbc:h2:mem:knowledge;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  thymeleaf:
    cache: false

server:
  port: 8080

admin:
  username: admin
  password: admin # TODO: replace for real environments

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
