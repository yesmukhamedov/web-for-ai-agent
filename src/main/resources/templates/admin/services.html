<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Admin - Services</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 2rem; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border-bottom: 1px solid #ddd; padding: 0.6rem; text-align: left; }
  </style>
</head>
<body>
  <h1>Admin: Services</h1>
  <p><a href="/admin/services/new">Create new service</a></p>
  <table>
    <thead>
      <tr>
        <th>Title</th>
        <th>Slug</th>
        <th>Status</th>
        <th>Authority</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="service : ${services}">
        <td th:text="${service.title}">Title</td>
        <td th:text="${service.slug}">Slug</td>
        <td th:text="${service.status}">Status</td>
        <td th:text="${service.authorityName}">Authority</td>
        <td><a th:href="@{'/admin/services/' + ${service.id} + '/edit'}">Edit</a></td>
      </tr>
    </tbody>
  </table>
</body>
</html>
