<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Admin - Service Form</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 2rem; }
    label { display: block; margin-top: 0.8rem; }
    input, textarea, select { width: 100%; padding: 0.4rem; }
    .error { color: #b00020; font-size: 0.9rem; }
  </style>
</head>
<body>
  <h1>Service form</h1>
  <form th:action="${formAction}" th:object="${serviceForm}" method="post">
    <label for="slug">Slug</label>
    <input type="text" id="slug" th:field="*{slug}" />
    <div class="error" th:if="${#fields.hasErrors('slug')}" th:errors="*{slug}">Slug error</div>

    <label for="title">Title</label>
    <input type="text" id="title" th:field="*{title}" />
    <div class="error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}">Title error</div>

    <label for="summary">Summary</label>
    <textarea id="summary" rows="3" th:field="*{summary}"></textarea>
    <div class="error" th:if="${#fields.hasErrors('summary')}" th:errors="*{summary}">Summary error</div>

    <label for="description">Description</label>
    <textarea id="description" rows="6" th:field="*{description}"></textarea>
    <div class="error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}">Description error</div>

    <label for="authorityName">Authority name</label>
    <input type="text" id="authorityName" th:field="*{authorityName}" />
    <div class="error" th:if="${#fields.hasErrors('authorityName')}" th:errors="*{authorityName}">Authority error</div>

    <label for="status">Status</label>
    <select id="status" th:field="*{status}">
      <option th:each="status : ${statuses}" th:value="${status}" th:text="${status}"></option>
    </select>
    <div class="error" th:if="${#fields.hasErrors('status')}" th:errors="*{status}">Status error</div>

    <label for="validFrom">Valid from</label>
    <input type="date" id="validFrom" th:field="*{validFrom}" />

    <label for="validTo">Valid to</label>
    <input type="date" id="validTo" th:field="*{validTo}" />

    <button type="submit">Save</button>
  </form>
</body>
</html>
